version = 1
name = "all-sky-mollweide"

# Mollweide shows the whole sphere: RA 0..360 and Dec -90..90.
[region]
kind = "equatorial"
frame = "icrs"
ra = [0, 360]
dec = [-90, 90]

[projection]
proj = "moll"

[projection.params]
R = 1
lon_0 = 180

[canvas]
size = [1600, 800]
background = "#ffffff"

[output]
formats = ["pdf", "svg", "html", "png"]
dir = "build/all-sky-mollweide"
# PNG is rendered at 3x the canvas size for readable labels and symbols.
png_scale = 3

[[layers]]
kind = "catalog"
source = "hipparcos"
labels = true
filter = { mag_lt = 7.5, label_mag_lt = 2.5 }

[[layers]]
kind = "catalog"
source = "ngc"
filter = { types = ["Gx", "OC", "Gb", "Nb", "C+N", "Pl"], mag_lt = 11 }

[[layers]]
kind = "catalog"
source = "deepspace"
labels = true

[[layers]]
kind = "grid"
frame = "equatorial"
step = 30

[[layers]]
kind = "constellations"
bounds = true
figures = true
labels = true

[theme]
include = "themes/claro.toml"
