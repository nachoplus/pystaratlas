[project]
name = "pystaratlas"
version = "0.1.0"
description = "Vector sky maps from TOML configurations, with PDF, SVG, PNG and HTML/CSS output"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = { file = "LICENSE" }
authors = [{ name = "Nacho Mas", email = "mas.ignacio@gmail.com" }]
keywords = ["astronomy", "sky-maps", "cartography", "pdf", "svg"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "astropy>=6.0",
  "click>=8.1",
  "Pillow>=10.0",
  "jinja2>=3.1",
  "pyproj>=3.6",
  "pydantic>=2.7",
  "reportlab>=4.2",
  "svgwrite>=1.4",
]

[project.scripts]
pystaratlas = "pystaratlas.cli:cli"

[project.optional-dependencies]
ephemerides = ["ephem>=4.1"]
images = ["requests>=2.32"]

[tool.poetry]
packages = [{ include = "pystaratlas", from = "src" }]
include = [
  { path = "src/pystaratlas/resources/data/*", format = ["sdist", "wheel"] },
  { path = "src/pystaratlas/resources/fonts/*", format = ["sdist", "wheel"] },
]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"
ruff = ">=0.5"
mypy = ">=1.10"
build = ">=1.2"
twine = ">=5.1"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [
  "atlas.py",
  "cajetin.py",
  "catalogues.py",
  "cosmomap.py",
  "imagebook.py",
  "internetcatalogues.py",
  "proj.py",
  "sesame.py",
  "solarsystem.py",
  "util.py",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src", "tests"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
